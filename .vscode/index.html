<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aluguel de Quadras</title>
    <link rel="stylesheet" href="quadra.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="slideshow-container">
        <!-- Slides das quadras -->
        <div class="quadra-slide active" style="background-image: url('imagens/AdobeStock_1325006627_Preview.jpeg');">
            <div class="slide-content">
                <h2>Quadra Poliesportiva 1</h2>
                <p>Vôlei / Futsal</p>
                <p class="price">R$ 90,00/hora</p>
                <button class="btn-alugar">Alugar Agora</button>
            </div>
        </div>
        
        <div class="quadra-slide" style="background-image: url('imagens/AdobeStock_1325006627_Preview.jpeg');">
            <div class="slide-content">
                <h2> Quadra Poliesportiva 2</h2>
                <p>Vôlei / Futsal</p>
                <p class="price">R$ 90,00/hora</p>
                <button class="btn-alugar">Alugar Agora</button>

            </div>
            
                
         </div>
        
        <div class="quadra-slide" style="background-image: url('imagens/AdobeStock_640053009_Preview.jpeg');">
            <div class="slide-content">
                <h2>Quadra de Areia 1</h2>
                <p>Vôlei de Praia</p>
                <p class="price">R$ 60,00/hora</p>
                <button class="btn-alugar">Alugar Agora</button>
            </div>
        </div>
        <div class="quadra-slide" style="background-image: url('imagens/AdobeStock_640053009_Preview.jpeg');">
            <div class="slide-content">
                <h2>Quadra de Areia 2</h2>
                <p>Futevôlei</p>
                <p class="price">R$ 60,00/hora</p>
                <button class="btn-alugar">Alugar Agora</button>
            </div>
        </div>
        
        <!-- Botões de navegação -->
        <button class="slide-btn prev-btn"><i class="fas fa-chevron-left"></i></button>
        <button class="slide-btn next-btn"><i class="fas fa-chevron-right"></i></button>
    </div>

    <script src="quadra.js"></script>
</body>
</html>
